<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>字幕测试页</title>
<style>body{margin:0;background:#222;color:#ddd;font:14px system-ui}#stage{position:relative;width:640px;height:360px;margin:20px auto;background:#000}video{width:640px;height:360px;display:block}
/* 模拟 YouTube / Netflix / 自定义播放器的字幕层 */
.ytp-caption-window-container{position:absolute;left:0;right:0;bottom:30px;text-align:center}.caption-window{display:inline-block;background:rgba(8,8,8,.75);color:#fff;padding:4px 8px}
.player-timedtext{position:absolute;left:0;right:0;bottom:30px;text-align:center}.player-timedtext-text-container{display:block;color:#fff;font-size:22px}
.my-subs{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#fff;font-size:22px}.my-subs .line{background:rgba(0,0,0,.6);padding:2px 8px}
</style></head>
<body><div id="stage">
<video id="v" src="/silence.wav" width="640" height="360" muted preload="auto"></video>
</div>
<script>
const mode = new URLSearchParams(location.search).get('mode') || 'track';
const CUES = [
  [0.0, 2.0, 'Salut, comment ça va ?'], [2.5, 4.5, "Je ne sais pas ce que vous voulez."], [5.0, 7.0, "C'est trop tard, il faut partir."],
  [7.5, 9.5, "Où est-ce que tu vas ?"], [10, 12, 'Je vais chez moi, merci.'], [12.5, 14.5, "Qu'est-ce que vous faites ici ?"],
  [15, 17, 'On doit parler, tous les deux.'], [17.5, 19.5, "Non, c'est impossible."], [20, 22, 'Il est très tard maintenant.'],
  [22.5, 24.5, 'Alors, à demain peut-être.'], [25, 27, 'Oui, à demain, mon ami.'], [27.5, 29.5, 'Bonne nuit à tous.'], [30, 32, '你到底想要什么？'],
];
window.CUES = CUES;
const v = document.getElementById('v');
if (mode === 'asr') v.src = '/speech.wav'; // 没有任何字幕的视频：只有声音（三段"说话"）
if (mode === 'track') {
  const t = document.createElement('track'); t.kind = 'subtitles'; t.srclang = 'fr'; t.label = 'Français'; t.src = '/fr.vtt'; t.default = true; v.append(t);
}
const stage = document.getElementById('stage');
// ---- 仿 YouTube：播放器数据 / 屏幕上滚动的字幕（3 个词一段）/ 转写文字面板 ----
const YT_DATA = __YT_DATA__;   // 服务端把 captionTracks 嵌在页面里（与真实页面 HTML 一样）
const VID = new URLSearchParams(location.search).get('v') || 'TESTVID12345';
if (/^yt(player|panel|panel2|observed|none|html)$/.test(mode)) { // （mode=yt 是更早的"只有屏幕字幕"的仿制页面，不在这里）
  const tracksOk = YT_DATA?.captions?.playerCaptionsTracklistRenderer?.captionTracks || [];
  const tracks = mode === 'ytnone' ? [] : tracksOk.map((t) => ({ ...t, baseUrl: t.baseUrl + (['ytpanel', 'ytpanel2', 'ytobserved'].includes(mode) ? '&variant=empty' : '') }));
  // 播放器自己请求过字幕（打开了 CC）：这个地址带着播放器才有的校验参数，能取到内容
  if (mode === 'ytobserved') fetch('/timedtext?v=' + VID + '&lang=fr&kind=asr&pot=abc123');
  const resp = mode === 'ythtml' ? { videoDetails: { videoId: 'STALEVIDEO1' } } : { videoDetails: { videoId: VID, title: 'Test video' }, captions: tracks.length ? { playerCaptionsTracklistRenderer: { captionTracks: tracks } } : undefined };
  window.ytInitialPlayerResponse = resp;
  if (mode !== 'ythtml') stage.insertAdjacentHTML('beforeend', '<div id="movie_player"></div>'), (document.getElementById('movie_player').getPlayerResponse = () => resp);
  // 屏幕上的"原生字幕"：自动字幕那样一个词一个词滚动、三个词一段，句子被切得很碎
  stage.insertAdjacentHTML('beforeend', '<div class="ytp-caption-window-container"></div>');
  const nat = stage.querySelector('.ytp-caption-window-container');
  fetch('/yt-words.json').then((r) => r.json()).then((ws) => {
    setInterval(() => { const t = v.currentTime; const i = ws.findLastIndex((x) => x.t <= t); const frag = i >= 0 && t - ws[i].t < 1.2 ? ws.slice(Math.floor(i / 3) * 3, Math.floor(i / 3) * 3 + 3).map((x) => x.w).join(' ') : ''; nat.innerHTML = frag ? `<div class="caption-window"><span class="captions-text"><span class="ytp-caption-segment">${frag}</span></span></div>` : ''; }, 100);
  });
  if (mode === 'ytpanel' || mode === 'ytpanel2') { // 转写文字面板（ytpanel2 = 新的 view-model 结构，按钮只能靠文字/aria-label 找到）：点按钮后出现每一段（每段 5 个词，开始时间精确到秒）
    document.body.insertAdjacentHTML('beforeend', mode === 'ytpanel' ? '<ytd-video-description-transcript-section-renderer><div><button id="show-tx">Show transcript</button></div></ytd-video-description-transcript-section-renderer>' : '<div id="description"><button id="show-tx" aria-label="Show transcript"><span>Show transcript</span></button></div>');
    document.getElementById('show-tx').onclick = async () => {
      const ws = await (await fetch('/yt-words.json')).json();
      const panel = document.createElement('ytd-engagement-panel-section-list-renderer');
      panel.setAttribute('target-id', 'engagement-panel-searchable-transcript');
      panel.innerHTML = '<div id="visibility-button"><button id="panel-close">x</button></div>';
      for (let i = 0; i < ws.length; i += 5) {
        const s = Math.floor(ws[i].t), ts = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`, txt = ws.slice(i, i + 5).map((x) => x.w).join(' ');
        const seg = document.createElement(mode === 'ytpanel' ? 'ytd-transcript-segment-renderer' : 'transcript-segment-view-model');
        seg.innerHTML = mode === 'ytpanel' ? `<div class="segment-timestamp">${ts}</div><yt-formatted-string class="segment-text">${txt}</yt-formatted-string>` : `<div class="ytwTranscriptSegmentViewModelTimestamp">${ts}</div><span class="yt-core-attributed-string" role="text">${txt}</span>`;
        panel.append(seg);
      }
      panel.querySelector('#panel-close').onclick = () => { window.__panelClosed = true; panel.remove(); };
      document.body.append(panel);
    };
  }
}
function cueNow() { const t = v.currentTime; return CUES.find((c) => t >= c[0] && t < c[1]); }
if (mode === 'yt') {
  stage.insertAdjacentHTML('beforeend', '<div class="ytp-caption-window-container"></div>');
  const box = stage.querySelector('.ytp-caption-window-container');
  setInterval(() => { const c = cueNow(); box.innerHTML = c ? `<div class="caption-window"><span class="captions-text"><span class="ytp-caption-segment">${c[2]}</span></span></div>` : ''; }, 100);
} else if (mode === 'netflix') {
  stage.insertAdjacentHTML('beforeend', '<div class="player-timedtext"></div>');
  const box = stage.querySelector('.player-timedtext');
  setInterval(() => { const c = cueNow(); box.innerHTML = c ? `<div><span class="player-timedtext-text-container"><span>${c[2].split(' ').slice(0, 3).join(' ')}</span><span>${c[2].split(' ').slice(3).join(' ')}</span></span></div>` : ''; }, 100);
} else if (mode === 'dom') {
  stage.insertAdjacentHTML('beforeend', '<div class="my-subs"></div>');
  const box = stage.querySelector('.my-subs');
  setInterval(() => { const c = cueNow(); box.innerHTML = c ? `<span class="line">${c[2]}</span>` : ''; }, 100);
}
</script></body></html>
